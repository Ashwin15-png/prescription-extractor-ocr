services:
  - type: web
    name: prescription-extractor-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: CORS_ORIGINS
        value: "*"
